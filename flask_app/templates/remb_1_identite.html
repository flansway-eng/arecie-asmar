{% extends "base.html" %}
{% block title %}Vos coordonnees — Remboursement ARECIE{% endblock %}
{% block content %}
<div class="container">
  <div class="card" style="max-width:520px;margin:2rem auto">

    <div class="card-header" style="background:var(--color-primary);padding:1.2rem 1.5rem;
                                    border-radius:8px 8px 0 0">
      <p style="color:#c8e6c9;margin:0 0 2px;font-size:.8rem">Etape 1 / 4 — Remboursement ASMAR</p>
      <h2 style="color:white;margin:0;font-size:1.2rem">Vos coordonnees</h2>
    </div>

    <div style="padding:1.5rem">

      {% if erreurs %}
      <div style="background:#fef2f2;border-left:4px solid var(--color-error);
                  padding:.85rem 1rem;border-radius:0 var(--radius) var(--radius) 0;margin-bottom:1rem">
        {% for e in erreurs %}
        <p style="margin:0;color:var(--color-error);font-size:.9rem">{{ e }}</p>
        {% endfor %}
      </div>
      {% endif %}

      <form method="POST">
        <div style="margin-bottom:1rem">
          <label style="display:block;font-weight:600;margin-bottom:.4rem;font-size:.9rem">
            Nom et prenom <span style="color:var(--color-error)">*</span>
          </label>
          <input type="text" name="nom_adherent" value="{{ d.nom_adherent or '' }}"
                 placeholder="Ex : KOUASSI Jean"
                 style="width:100%;padding:.75rem;border:1px solid #d1d5db;
                        border-radius:var(--radius);font-size:1rem;box-sizing:border-box"
                 required>
        </div>

        <div style="margin-bottom:1rem">
          <label style="display:block;font-weight:600;margin-bottom:.4rem;font-size:.9rem">
            Numero adherent
          </label>
          <input type="text" name="numero_adherent" value="{{ d.numero_adherent or '' }}"
                 placeholder="Ex : G1532-00558-C1"
                 style="width:100%;padding:.75rem;border:1px solid #d1d5db;
                        border-radius:var(--radius);font-size:1rem;box-sizing:border-box">
        </div>

        <div style="margin-bottom:1.5rem">
          <label style="display:block;font-weight:600;margin-bottom:.4rem;font-size:.9rem">
            Numero WhatsApp <span style="color:var(--color-error)">*</span>
          </label>
          <input type="tel" name="telephone" value="{{ d.telephone or '' }}"
                 placeholder="+225 07 00 00 00 00"
                 style="width:100%;padding:.75rem;border:1px solid #d1d5db;
                        border-radius:var(--radius);font-size:1rem;box-sizing:border-box"
                 required>
        </div>

        <div style="display:flex;gap:.75rem">
          <a href="{{ url_for('remboursement_accueil') }}"
             style="flex:1;text-align:center;background:#f3f4f6;color:#444;
                    padding:.85rem;border-radius:var(--radius);text-decoration:none;
                    font-size:.95rem">
            Retour
          </a>
          <button type="submit"
                  style="flex:2;background:var(--color-primary);color:white;
                         border:none;padding:.85rem;border-radius:var(--radius);
                         font-size:1rem;font-weight:600;cursor:pointer">
            Suivant &rarr;
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}
